<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Borough</title><style>body{margin:0;overflow:hidden;font:14px system-ui;background:#15243d;color:white}#panel{position:absolute;top:15px;left:15px;background:#14243cdd;padding:17px;border-radius:18px;max-width:275px;backdrop-filter:blur(12px)}h2{margin:0 0 8px}button{background:#304d69;color:white;border:0;padding:10px;border-radius:8px;margin:3px;cursor:pointer}button.active{background:#16a89d}input{width:180px}small{display:block;margin-top:12px;line-height:1.5}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"}}</script></head><body><div id="panel"><h2>🌆 Neon Borough</h2><div>💰 <b id="cash"></b> · 👥 <b id="pop"></b></div><div id="tools"></div><p>☀️ <input id="clock" type="range" min="0" max="24" step=".1" value="13"> 🌙 <button id="pause">⏸</button></p><button id="reset">↻ New City</button><small>Click to build · Drag to orbit · Right-drag to pan · Scroll to zoom · Keys 1–6 select tools · Space pauses time</small></div><script type="module">
import * as T from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const scene=new T.Scene(),camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,400),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);camera.position.set(40,52,67);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=1.5;controls.maxDistance=135;controls.minDistance=12;const hemi=new T.HemisphereLight(0xffffff,0x506c88,2);scene.add(hemi);const sun=new T.DirectionalLight(0xfff4d4,3);sun.position.set(40,65,30);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=sun.shadow.camera.bottom=-85;sun.shadow.camera.right=sun.shadow.camera.top=85;scene.add(sun);const material=c=>new T.MeshStandardMaterial({color:c,roughness:.7});const colors=['#f87e91','#77a4ee','#f7be6e','#ab91ed','#58cfb3','#eaa5d8'],road=material('#34415a'),grass=material('#70cb8b'),pavement=material('#e2e2df'),white=material('#f6e8ba'),trunk=material('#88694d');function cube(w,h,d,m,x,y,z,g=scene){const a=new T.Mesh(new T.BoxGeometry(w,h,d),m);a.position.set(x,y,z);a.castShadow=true;a.receiveShadow=true;g.add(a);return a}cube(115,.4,115,grass,0,-.4,0);const N=11,S=7,offset=35,roadset=new Set([1,5,9]),lots=new Map(),cars=[];const isRoad=(i,j)=>roadset.has(i)||roadset.has(j),coord=i=>i*S-offset;for(let i=0;i<N;i++)for(let j=0;j<N;j++){const x=coord(i),z=coord(j),r=isRoad(i,j);cube(6.95,.12,6.95,r?road:pavement,x,0,z);if(r){if(roadset.has(i)&&!roadset.has(j))for(let k=-2;k<=2;k++)cube(.12,.02,.6,white,x,.08,z+k*1.1);if(roadset.has(j)&&!roadset.has(i))for(let k=-2;k<=2;k++)cube(.6,.02,.12,white,x+k*1.1,.08,z)}else cube(6.1,.1,6.1,pavement,x,.13,z)}
let money=18000,pop=0,tool='tower',time=13,playing=true;const prices={tower:2200,office:1300,homes:650,park:400,road:250};function update(){document.querySelector('#cash').textContent='$'+Math.floor(money).toLocaleString();document.querySelector('#pop').textContent=pop.toLocaleString()}function tree(g,x,z){cube(.23,1,.23,trunk,x,.7,z,g);const leaf=new T.Mesh(new T.IcosahedronGeometry(.75,1),material(['#3eb87b','#83d26d','#2fa990'][Math.floor(Math.random()*3)]));leaf.position.set(x,1.6,z);g.add(leaf)}function build(type,i,j,free=false){const k=i+','+j;if(isRoad(i,j)||lots.has(k))return false;if(!free&&money<prices[type])return false;if(!free)money-=prices[type];const g=new T.Group();g.position.set(coord(i),.18,coord(j));scene.add(g);let people=0;if(type==='park'){cube(5.9,.12,5.9,grass,0,.1,0,g);for(let n=0;n<6;n++)tree(g,(Math.random()-.5)*4.5,(Math.random()-.5)*4.5);cube(.6,.12,5,material('#e7d3a7'),0,.2,0,g)}else if(type==='road'){cube(6,.14,6,road,0,.13,0,g)}else{const h=type==='tower'?13+Math.random()*21:type==='office'?7+Math.random()*9:3+Math.random()*2,w=type==='homes'?3.7:4.4;cube(w,h,w,material(colors[Math.floor(Math.random()*colors.length)]),0,h/2,0,g);cube(w+.2,.25,w+.2,pavement,0,h+.1,0,g);if(type==='tower')cube(.12,2,.12,pavement,0,h+1.2,0,g);const glass=material('#b5e8f9');for(let level=1;level<h/1.6;level++)for(let n=-1;n<=1;n++)for(let side of [-1,1]){cube(.65,.8,.05,glass,n*w/3,level*1.6,side*w/2,g);cube(.05,.8,.65,glass,side*w/2,level*1.6,n*w/3,g)}people=Math.floor(h*(type==='tower'?18:type==='office'?7:5));pop+=people}lots.set(k,{g,people,type});update();return true}function erase(i,j){const k=i+','+j,a=lots.get(k);if(!a)return;scene.remove(a.g);lots.delete(k);pop-=a.people;money+=Math.floor((prices[a.type]||0)*.4);update()}
const types=['tower','office','homes','park','road','erase'];for(let n=0;n<types.length;n++){const b=document.createElement('button');b.textContent=['🏙 Tower','🏢 Office','🏠 Homes','🌳 Park','🛣 Road','🧹 Erase'][n];b.onclick=()=>select(types[n]);b.dataset.type=types[n];document.querySelector('#tools').append(b)}function select(t){tool=t;document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===t))}select('tower');for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(!isRoad(i,j)&&Math.random()<.62)build(Math.random()<.16?'park':Math.random()<.62?'tower':'office',i,j,true);
for(let n=0;n<30;n++){const g=new T.Group(),horizontal=Math.random()<.5;cube(horizontal?1.6:.85,.5,horizontal?.85:1.6,material(['#f7cb43','#f67b82','#ffffff','#68c6ed'][n%4]),0,.5,0,g);cube(horizontal?.8:.65,.35,horizontal?.65:.8,material('#b7e5f6'),0,.85,0,g);scene.add(g);cars.push({g,horizontal,road:[1,5,9][n%3],lane:n%2?1.1:-1.1,pos:Math.random()*77,speed:2+Math.random()*3,dir:n%2?1:-1})}
const ray=new T.Raycaster(),mouse=new T.Vector2(),plane=new T.Plane(new T.Vector3(0,1,0),0),hit=new T.Vector3();let start;renderer.domElement.onpointerdown=e=>start=[e.clientX,e.clientY,e.button];renderer.domElement.onpointerup=e=>{if(!start||start[2]!==0||Math.hypot(e.clientX-start[0],e.clientY-start[1])>6)return;mouse.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);ray.setFromCamera(mouse,camera);if(!ray.ray.intersectPlane(plane,hit))return;const i=Math.round((hit.x+offset)/S),j=Math.round((hit.z+offset)/S);if(i<0||j<0||i>=N||j>=N)return;if(tool==='erase')erase(i,j);else build(tool,i,j)};document.onkeydown=e=>{if(e.target.tagName==='INPUT')return;if('123456'.includes(e.key))select(types[+e.key-1]);if(e.code==='Space'){e.preventDefault();toggle()}};function toggle(){playing=!playing;document.querySelector('#pause').textContent=playing?'⏸':'▶'}document.querySelector('#pause').onclick=toggle;document.querySelector('#clock').oninput=e=>{time=+e.target.value;playing=false;document.querySelector('#pause').textContent='▶'};document.querySelector('#reset').onclick=()=>{if(!confirm('Start a new city?'))return;for(const a of lots.values())scene.remove(a.g);lots.clear();money=18000;pop=0;update()};update();let last=performance.now(),income=0;function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;controls.update();income+=dt;if(income>=1){money+=25+Math.floor(pop/200);income=0;update()}if(playing){time=(time+dt*.35)%24;document.querySelector('#clock').value=time}const day=Math.max(0,Math.sin((time-6)/24*Math.PI*2)),sky=new T.Color('#14203d').lerp(new T.Color('#8ed9ff'),Math.max(.05,day));scene.background=sky;hemi.intensity=.45+day*1.65;sun.intensity=.2+day*2.8;sun.position.set(Math.cos(time/24*Math.PI*2)*65,Math.max(4,day*75),25);for(const c of cars){c.pos=(c.pos+c.speed*dt*c.dir+77)%77;if(c.horizontal){c.g.position.set(c.pos-offset-3.5,.1,coord(c.road)+c.lane);c.g.rotation.y=Math.PI/2}else{c.g.position.set(coord(c.road)+c.lane,.1,c.pos-offset-3.5);c.g.rotation.y=0}}renderer.render(scene,camera)}requestAnimationFrame(frame);onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></body></html>
